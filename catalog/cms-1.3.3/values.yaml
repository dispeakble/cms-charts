<namespace: default
replicaCount: 1
nameOverride: ''
fullnameOverride: ''

global:
  version: "1.3.3"
  namespace: default
  images:
    hub: dispeakble/crm-hub:1643468069
    db: dispeakble/crm-db:1643468069
    proxy: dispeakble/crm-proxy:1643468069
    frontendproxy: dispeakble/crm-frontend-proxy:1643468069
    frontendapi: dispeakble/crm-frontend-api:1643468069
    system: dispeakble/crm-system:1643468069
    bucket: dispeakble/crm-bucket:1643468069
  env: "local"
  redis:
    port: "6379"
    host: "redis-master"
  redis_headless:
    port: "6379"
    host: "redis-headless"
  db:
    name: "cms"
    host: "postgresql-ha-pgpool"
    user: "cms"
      valueFrom:
       secretKeyRef:
         key: global.db.user
         name: redis
         optional: false
    password:
      valueFrom:
        secretKeyRef:
          key: global.db.password
          name: redis
          optional: false
  proxy:
    ports:
      admin: "9696"
      public: "9797"